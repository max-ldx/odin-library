<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Maximilien Ledoux</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Library</h1>
    <div class="books">
        <button id="new-book-button">+</button>
        <div id="library"></div>
    </div>
    <dialog>
        <h2 class="dialog-title">Add a book</h2>
        <form id="new-book-form" action="#" method="dialog">
            <p class="form-group">
                <label for="title">Title *:</label>
                <input type="text" name="title" id="title" required>
            </p>
            <p class="form-group">
                <label for="author">Author *:</label>
                <input type="text" name="author" id="author" required>
            </p>
            <p class="form-group">
                <label for="pages">Pages *:</label>
                <input type="tel" name="pages" id="pages" required>
            </p>
            <p class="form-group">
                <label for="read">Read:</label>
                <input type="checkbox" name="read" id="read">
            </p>
            <div class="form-buttons">
                <button type="button" id="dialog-close-button">Close</button>
                <button>Add book</button>
            </div>
        </form>
    </dialog>
</body>

</html>
